# Theme: Black Atom — MNML ∷ 47 Light
# Appearance: light
# Collection: MNML (Minimal)

# Status bar
set -g status-style fg=#3a816a,bg=#dcf1e9
set -g status-left-style fg=#e95e00,bg=#dcf1e9
set -g status-right-style fg=#3a816a,bg=#dcf1e9

# Window status
set-window-option -g window-status-style fg=#3a816a
set-window-option -g window-status-current-style fg=#e95e00,bold
set-window-option -g window-status-activity-style fg=#00a3e9,bold
set-window-option -g window-status-bell-style fg=#00a3e9,bold

# Pane borders
set -g pane-border-style fg=#3a816a
set -g pane-active-border-style fg=#e95e00

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#3a816a
set -g window-active-style fg=#194034

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#e95e00]●,#[fg=#3a816a]○}"

# Session switcher & copy mode
set -g mode-style fg=#e95e00,bg=#f1fbf7

# Messages & command prompt - minimal style
set -g message-style fg=#00a3e9,bg=#dcf1e9,bold
set -g message-command-style fg=#e95e00,bg=#dcf1e9

# Display panes
set -g display-panes-active-colour "#e95e00"
set -g display-panes-colour "#3a816a"
