# Theme: Black Atom — MNML ∷ 47 Dark
# Appearance: dark
# Collection: MNML (Minimal)

# Status bar
set -g status-style fg=#6fb59d,bg=#194034
set -g status-left-style fg=#ed9562,bg=#194034
set -g status-right-style fg=#6fb59d,bg=#194034

# Window status
set-window-option -g window-status-style fg=#6fb59d
set-window-option -g window-status-current-style fg=#ed9562,bold
set-window-option -g window-status-activity-style fg=#79b5cc,bold
set-window-option -g window-status-bell-style fg=#79b5cc,bold

# Pane borders
set -g pane-border-style fg=#6fb59d
set -g pane-active-border-style fg=#ed9562

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#6fb59d
set -g window-active-style fg=#dcf1e9

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#ed9562]●,#[fg=#6fb59d]○}"

# Session switcher & copy mode
set -g mode-style fg=#ed9562,bg=#204c3e

# Messages & command prompt - minimal style
set -g message-style fg=#79b5cc,bg=#194034,bold
set -g message-command-style fg=#ed9562,bg=#194034

# Display panes
set -g display-panes-active-colour "#ed9562"
set -g display-panes-colour "#6fb59d"
